[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arena-agent"
version = "0.1.0"
description = "Let AI agents (Claude, Codex, any MCP client) build, run and analyse Rockwell Arena simulation models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Musaib Bin Bashir" }]
requires-python = ">=3.10"
keywords = ["arena", "simulation", "discrete-event", "mcp", "claude", "codex", "rockwell"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "mcp>=2.0,<3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arena-agent = "arena_agent.cli:main"

[project.urls]
Homepage = "https://github.com/MusaibBashir/arena-agent"
Issues = "https://github.com/MusaibBashir/arena-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills/arena-modeling" = "arena_agent/skills/arena-modeling"
"examples" = "arena_agent/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["arena: needs a local Arena installation (run with -m arena)"]
addopts = "-m 'not arena'"
